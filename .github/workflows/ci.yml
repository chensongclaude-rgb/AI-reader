# 自动检查：每次 push 或开 PR 时，GitHub 会借一台电脑按下面的步骤跑一遍
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 运行测试
        run: npm test

      - name: 打包前端
        run: npm run build
